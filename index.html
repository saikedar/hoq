<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>House of Quality — Guided Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f0e6; --panel:#fffdf7; --panel2:#faf6ec; --ink:#17212f; --muted:#667085; --line:#d8d0bd;
  --accent:#1e4bd1; --accent-ink:#ffffff; --tint:#e4ebff; --warm:#d9811a; --good:#15803d; --good-bg:#e3f4e8;
  --bad:#b4281c; --bad-bg:#fbe7e4; --note-bg:#eef2ff; --shadow:0 1px 0 rgba(23,33,47,.04),0 8px 24px rgba(23,33,47,.07);
  --pos:rgba(21,128,61,.18); --neg:rgba(180,40,28,.18);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --serif:'Fraunces',Georgia,'Times New Roman',serif; --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1522; --panel:#152033; --panel2:#111b2c; --ink:#e7ecf6; --muted:#93a0b6; --line:#2a3a56;
    --accent:#7ba3ff; --accent-ink:#0b1220; --tint:#1c2c52; --warm:#f0a64a; --good:#4ade80; --good-bg:#12301f;
    --bad:#ff8a7a; --bad-bg:#3a1a17; --note-bg:#17254a; --shadow:0 8px 24px rgba(0,0,0,.35);
    --pos:rgba(74,222,128,.22); --neg:rgba(255,138,122,.22);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1522; --panel:#152033; --panel2:#111b2c; --ink:#e7ecf6; --muted:#93a0b6; --line:#2a3a56;
  --accent:#7ba3ff; --accent-ink:#0b1220; --tint:#1c2c52; --warm:#f0a64a; --good:#4ade80; --good-bg:#12301f;
  --bad:#ff8a7a; --bad-bg:#3a1a17; --note-bg:#17254a; --shadow:0 8px 24px rgba(0,0,0,.35);
  --pos:rgba(74,222,128,.22); --neg:rgba(255,138,122,.22);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px); height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15.5px/1.6 var(--sans);min-height:100%;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;background-position:-1px -1px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;background:var(--bg);opacity:.9;z-index:-1}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2;margin:0}
h2{font-size:1.65rem;letter-spacing:-.01em}
h3{font-size:1.1rem}
p{margin:.55em 0}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:1260px;margin:0 auto;padding:0 18px 60px}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:0 0 14px 14px;
  box-shadow:var(--shadow);padding:10px 16px 12px;margin-bottom:22px}
.hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:1.05rem}
.brand svg{width:30px;height:30px}
.brand small{display:block;font:500 11px var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.spacer{flex:1}
.who{font:500 12.5px var(--mono);color:var(--muted)}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:9px}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--warm));width:0;transition:width .4s}
.stepper{display:flex;gap:6px;margin-top:9px;overflow-x:auto;padding-bottom:2px}
.pill{flex:0 0 auto;min-width:30px;height:30px;padding:0 9px;border-radius:99px;border:1.5px solid var(--line);background:var(--panel2);
  font:500 12px var(--mono);display:grid;place-items:center;color:var(--muted)}
.pill.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill.cur{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--tint);background:var(--panel)}
.pill.cur.done{background:var(--accent);color:var(--accent-ink)}
.pill:disabled{opacity:.45;cursor:not-allowed}

/* layout */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 24px}
.stage{display:grid;gap:20px;grid-template-columns:minmax(0,1fr);grid-template-areas:"story" "house" "q"}
.story{grid-area:story}.house-panel{grid-area:house}.qs{grid-area:q;display:grid;gap:16px}
@media (min-width:1060px){
  .stage{grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr);grid-template-areas:"story house" "q house";align-items:start}
  .house-panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 118px)}
}
.kicker{font:500 11.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
.lead{font-size:1.05rem;color:var(--ink)}
.callout{border-left:4px solid var(--warm);background:var(--panel2);border-radius:0 10px 10px 0;padding:10px 14px;margin:14px 0}
.callout b.t{display:block;font:600 11.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--warm);margin-bottom:2px}
.callout.blue{border-left-color:var(--accent)} .callout.blue b.t{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:3px 11px;font-size:13px}
.formula{font:500 15px var(--mono);background:var(--note-bg);border-radius:10px;padding:10px 14px;margin:12px 0;overflow-x:auto;white-space:nowrap}
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.tl div{border-top:3px solid var(--accent);padding-top:6px;font-size:13.5px}
.tl b{display:block;font:600 18px var(--serif)}
ol.phases{padding-left:0;list-style:none;display:grid;gap:6px;margin:10px 0;counter-reset:ph}
ol.phases li{counter-increment:ph;display:flex;gap:10px;align-items:flex-start;font-size:14px}
ol.phases li::before{content:counter(ph);flex:0 0 24px;height:24px;border-radius:50%;background:var(--panel2);border:1.5px solid var(--line);display:grid;place-items:center;font:500 12px var(--mono)}
ol.phases li.hl::before{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.src{font-size:12.5px;color:var(--muted)}

/* house panel */
.hp-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.hp-head h3{font-size:1rem}
.tag{font:500 11px var(--mono);color:var(--muted);letter-spacing:.04em}
.house-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:6px}
.house{min-width:700px}
.house svg{display:block;width:100%;height:auto}
.room{transition:opacity .3s}
.house:not([data-focus~="all"]) .room{opacity:.2}
.house[data-focus~="whats"] .room-whats,.house[data-focus~="hows"] .room-hows,.house[data-focus~="matrix"] .room-matrix,
.house[data-focus~="roof"] .room-roof,.house[data-focus~="basement"] .room-basement,.house[data-focus~="right"] .room-right{opacity:1}
.house.pickable .room{cursor:pointer}
.cell{fill:var(--panel);stroke:var(--line);stroke-width:1}
.cell.band{fill:var(--panel2)}
.cell.ed{cursor:pointer}.cell.ed:hover,.cell.ed:focus{fill:var(--tint);outline:none;stroke:var(--accent)}
.bar{fill:var(--accent);opacity:.18}
.cap{font:600 10px var(--mono);letter-spacing:.08em;fill:var(--accent)}
.sub{font:400 10.5px var(--sans);fill:var(--muted)}
.lbl{font:500 12.5px var(--sans);fill:var(--ink)}
.hl{font:500 11.5px var(--sans);fill:var(--ink);text-anchor:middle}
.dirt{font:500 10.5px var(--mono);fill:var(--ink);text-anchor:middle}
.wv{font:600 15px var(--mono);fill:var(--ink);text-anchor:middle}
.wp{font:400 9.5px var(--mono);fill:var(--muted);text-anchor:middle}
.num{font:400 9px var(--mono);fill:var(--muted)}
.tpv{font:600 14px var(--mono);fill:var(--ink);text-anchor:middle}
.rk{font:600 9.5px var(--mono);fill:var(--warm)}
.sym9o{fill:none;stroke:var(--ink);stroke-width:2;pointer-events:none}
.sym9i{fill:var(--ink);pointer-events:none}
.sym3{fill:none;stroke:var(--ink);stroke-width:2;pointer-events:none}
.sym1{fill:none;stroke:var(--ink);stroke-width:2;pointer-events:none}
.rf{stroke:var(--line);stroke-width:1;fill:var(--panel)}
.rf.p{fill:var(--pos)}.rf.n{fill:var(--neg)}
.rf.ed{cursor:pointer}.rf.ed:hover,.rf.ed:focus{stroke:var(--accent);stroke-width:2;outline:none}
.rft{font:700 15px var(--mono);text-anchor:middle;pointer-events:none}
.rft.p{fill:var(--good)}.rft.n{fill:var(--bad)}
.room.sel .cell,.room.sel .rf{stroke:var(--accent);stroke-width:2}
.dotU{fill:var(--accent)}.dotA{fill:var(--warm)}.dotB{fill:#7a5af8}
.tick{stroke:var(--line);stroke-width:1}
.dash{fill:none;stroke:var(--line);stroke-dasharray:4 4}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin:10px 2px 2px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend svg{width:18px;height:18px}
.hint-scroll{font-size:12px;color:var(--muted);margin:6px 2px 0}
@media (min-width:760px){.hint-scroll{display:none}}

/* tools */
.tool{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.tool h4{margin:0 0 6px;font:600 11.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.wrow{display:grid;grid-template-columns:minmax(110px,1.3fr) minmax(90px,2fr) 26px 54px;gap:8px;align-items:center;font-size:13.5px;padding:2px 0}
.wrow .v{font:600 13px var(--mono);text-align:right}.wrow .p{font:400 12px var(--mono);color:var(--muted);text-align:right}
input[type=range]{width:100%;accent-color:var(--accent)}
.btn{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:5px 10px;font-size:12.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.readout{min-height:44px;background:var(--note-bg);border-radius:10px;padding:8px 12px;font-size:13.5px;margin-top:8px}
.bars{display:grid;gap:6px;margin-top:8px}
.brow{display:grid;grid-template-columns:150px 1fr 88px;gap:8px;align-items:center;font-size:13px}
.brow .track{height:16px;background:var(--panel2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.brow .track i{display:block;height:100%;background:var(--accent);transition:width .3s}
.brow:first-child .track i{background:var(--warm)}
.brow .val{font:500 12px var(--mono);text-align:right}
@media(max-width:520px){.brow{grid-template-columns:100px 1fr 74px}.wrow{grid-template-columns:90px 1fr 22px 46px}}
table.t{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{font:600 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
table.t tr.top td{background:var(--tint);font-weight:600}
.cas{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cas button{border:1.5px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 6px;font-size:12.5px;text-align:center}
.cas button.on{border-color:var(--accent);background:var(--tint);font-weight:600}
@media(max-width:520px){.cas{grid-template-columns:repeat(2,1fr)}}
.roompanel{background:var(--note-bg);border-radius:10px;padding:10px 14px;margin-top:10px;min-height:92px;font-size:14px}
.roompanel b{font-family:var(--serif)}

/* questions */
.qcard{background:var(--panel);border:1.5px solid var(--accent);border-radius:16px;box-shadow:var(--shadow);padding:18px 22px}
.qcard.locked{border-color:var(--line)}
.qhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.qtag{font:600 11.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.qkind{font:500 11px var(--mono);color:var(--muted)}
.qprompt{font-weight:500;font-size:1.02rem;margin:.3em 0 .8em}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--panel2);border-radius:12px;padding:9px 12px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .ol{flex:0 0 24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:500 12px var(--mono)}
.opt.chosen{border-color:var(--accent);background:var(--tint)}.opt.chosen .ol{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-bg)}.opt.right .ol{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}.opt.wrong .ol{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.numrow{display:flex;gap:8px;align-items:center}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--panel2);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px}
input[type=text]{max-width:200px}
textarea{min-height:130px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--tint)}
.count{font:400 12px var(--mono);color:var(--muted);margin-top:4px}
.qfoot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
.warn{color:var(--bad);font-size:13px}
.fb{margin-top:12px;border-radius:12px;padding:11px 14px;font-size:14.5px}
.fb.ok{background:var(--good-bg);border:1px solid var(--good)}.fb.bad{background:var(--bad-bg);border:1px solid var(--bad)}.fb.note{background:var(--note-bg);border:1px solid var(--accent)}
.fb ul{margin:.3em 0 0;padding-left:1.2em}
.stamp{font:400 12px var(--mono);color:var(--muted);margin-top:8px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px;align-items:center;flex-wrap:wrap}
.nav .msg{font-size:13px;color:var(--muted)}

/* welcome / record */
.hero{display:grid;gap:22px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
@media(max-width:860px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(2rem,4.4vw,3.1rem);letter-spacing:-.02em}
.hero h1 em{color:var(--accent);font-style:italic}
.field{display:grid;gap:4px;margin:12px 0}
.field label{font:600 11.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input{max-width:none}
.steps3{display:grid;gap:8px;margin:14px 0;padding:0;list-style:none}
.steps3 li{display:flex;gap:10px;font-size:14.5px}
.steps3 li b{font:600 12px var(--mono);color:var(--accent);flex:0 0 22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.kpi b{display:block;font:700 1.7rem var(--serif)}.kpi span{font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rep-item{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:10px 0;background:var(--panel)}
.rep-item h4{margin:0 0 4px;font:600 13px var(--mono);color:var(--accent)}
.rep-item .q{font-weight:500}
.rep-item .r{margin-top:6px;white-space:pre-wrap}
.res-ok{color:var(--good);font-weight:600}.res-bad{color:var(--bad);font-weight:600}.res-note{color:var(--accent);font-weight:600}
table.log{width:100%;border-collapse:collapse;font-size:13px}
table.log th,table.log td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.log th{font:600 11px var(--mono);color:var(--muted);text-transform:uppercase}
.tablewrap{overflow-x:auto}
.savemsg{font-size:14px;margin-top:10px}

@media print{
  .noprint{display:none!important}
  body{background:#fff!important;color:#000}body::before{display:none}
  .card,.rep-item{box-shadow:none!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="app">
  <header class="hdr noprint" id="hdr">
    <div class="hrow">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 15 16 3l13 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" style="color:var(--accent)"/><rect x="6" y="15" width="20" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--ink)"/><path d="M6 21.5h20M16 15v13" stroke="currentColor" stroke-width="1.2" style="color:var(--muted)"/></svg>
        <div>House of Quality<small>Guided tour · Operations Management</small></div>
      </div>
      <div class="spacer"></div>
      <div class="who" id="who"></div>
    </div>
    <div class="prog"><i id="progbar"></i></div>
    <div class="stepper" id="stepper"></div>
  </header>
  <main id="app"></main>
</div>

<script>
"use strict";
/* ============================== DATA ============================== */
const NEEDS=[{name:'Long-Lasting Power',w:9},{name:'Fast Recharging',w:8},{name:'Portability / Weight',w:7},{name:'Quiet Operation',w:5}];
const HOWS=[
 {name:'Battery Capacity',unit:'Wh',dir:'up',target:'2000+ Wh'},
 {name:'Input Charging Rate',unit:'W',dir:'up',target:'1000+ W'},
 {name:'Total Unit Weight',unit:'kg',dir:'down',target:''},
 {name:'Fan Noise Level',unit:'dB',dir:'down',target:''},
 {name:'Inverter Efficiency',unit:'%',dir:'up',target:''}];
const R0=[[9,1,1,0,9],[1,9,0,0,0],[9,1,9,0,1],[0,1,0,9,1]];
const ROOF0={'0-1':3,'0-2':-9,'1-2':3,'1-3':-9};
const COMP={us:[3,2,4,4],a:[4,4,3,3],b:[3,3,3,2]};   // illustrative
function freshModel(){return{w:NEEDS.map(n=>n.w),R:R0.map(r=>r.slice()),roof:Object.assign({},ROOF0),dir:HOWS.map(h=>h.dir),us:COMP.us.slice(),norm:false};}
const tp=m=>HOWS.map((_,j)=>m.w.reduce((s,w,i)=>s+w*m.R[i][j],0));

const ROOMS={
 whats:{t:'Left wall — Customer needs (the “Whats”)',d:'The voice of the customer in the customer’s own words, gathered from interviews, focus groups and surveys. Each need carries an importance rating (1–5 in Lucidchart’s smartphone example, 1–9 in the Anker case).'},
 hows:{t:'Ceiling — Technical requirements (the “Hows”)',d:'The design team’s answer to every What: measurable engineering characteristics, each with a unit, a target value and a direction of improvement (maximise, minimise or hit a nominal value).'},
 matrix:{t:'Main room — Relationship matrix',d:'Where Whats meet Hows. Each cell scores how strongly a technical characteristic influences a customer need — typically 9 strong, 3 moderate, 1 weak, empty for none.'},
 roof:{t:'Roof — Interrelationships between Hows',d:'Pairwise correlations among the technical requirements. Synergies (+) and trade-offs (−) are exposed early so the team can compromise deliberately or innovate its way out.'},
 basement:{t:'Basement — Prioritised technical requirements',d:'Technical priority of each How: the sum of (customer importance × relationship strength) down its column, usually also shown as a share of the total, together with target values.'},
 right:{t:'Right wall — Competitive assessment',d:'How you and your rivals perform on each customer need (perception), plus lab-measured technical benchmarks. It does not change the priority scores, but shows where you are exposed or ahead.'}
};
const CAS=[
 {t:'House 1 · Product planning',w:'Customer needs',h:'Product design characteristics',ex:'“Easy to use” → door closing force (N), closing sound level (dB).'},
 {t:'House 2 · Parts deployment',w:'Product design characteristics',h:'Critical part characteristics',ex:'Low closing force → the spring constant of a component.'},
 {t:'House 3 · Process planning',w:'Critical part characteristics',h:'Key manufacturing processes',ex:'Spring constant → machining tolerances and material-handling steps.'},
 {t:'House 4 · Quality control / operations',w:'Key manufacturing processes',h:'Production control requirements',ex:'Machining step → quality checks, inspection points, operator training protocols.'}
];

function sym(v,cx,cy){
  if(v===9)return `<circle cx="${cx}" cy="${cy}" r="13" class="sym9o"/><circle cx="${cx}" cy="${cy}" r="6" class="sym9i"/>`;
  if(v===3)return `<circle cx="${cx}" cy="${cy}" r="10" class="sym3"/>`;
  if(v===1)return `<polygon points="${cx},${cy-10} ${cx+10},${cy+8} ${cx-10},${cy+8}" class="sym1"/>`;
  return '';
}
const ROOFLAB={'9':'strong positive (++)','3':'positive (+)','0':'no interaction','-3':'negative (−)','-9':'strong negative (−−)'};
function houseSVG(m,k){
  const tool=STATIONS[k].tool;
  const colW=84,rowH=46,X0=12,labelW=188,wCol=48,mx=X0+labelW+wCol,roofBase=146,hh=26,hw=colW/2;

  for(let i=0;i<5;i++)for(let j=i+1;j<5;j++){

    if(v)s+=`<text class="rft ${cls}" x="${cx}" y="${cy+5}">${v===9?'++':v===3?'+':v===-3?'−':'−−'}</text>`;
  }

    s+=`<text class="dirt" style="pointer-events:none" x="${xc(j)}" y="${dirTop+16}">${up?'▲ max':'▼ min'} · ${HOWS[j].unit}</text>`;

  s+=`<g class="room room-whats ${state.room==='whats'?'sel':''}" data-room="whats">`;
  s+=`<rect class="cell band" x="${X0}" y="${roofBase}" width="${labelW+wCol}" height="${howsH+dirH}"/>`;
  s+=`<text class="cap" x="${X0+8}" y="${roofBase+34}">CUSTOMER NEEDS</text><text class="sub" x="${X0+8}" y="${roofBase+50}">(the Whats)</text>`;
  s+=`<text class="sub" style="text-anchor:middle" x="${X0+labelW+wCol/2}" y="${dirTop+16}">weight</text>`;
  for(let i=0;i<4;i++){
    const y=matTop+i*rowH;
    s+=`<rect class="cell" x="${X0}" y="${y}" width="${labelW}" height="${rowH}"/><text class="lbl" x="${X0+10}" y="${y+rowH/2+4}">${esc(NEEDS[i].name)}</text>`;

  }

  /* MATRIX */
  s+=`<g class="room room-matrix ${state.room==='matrix'?'sel':''}" data-room="matrix">`;
  for(let i=0;i<4;i++)for(let j=0;j<5;j++){

    s+=sym(v,x+colW/2,y+rowH/2);

  }
  s+=`</g>`;

  const rows=[['Technical priority',36],['Share of total',30],['Target',30]];

function qHTML(q){
  const a=state.ans[q.id],n=QNUM[q.id],d=state.draft[q.id];
  const kind=q.type==='mcq'?'multiple choice':q.type==='num'?'calculation':'reflection';
  let h=`<article class="qcard ${a?'locked':''}" id="card-${q.id}"><div class="qhead"><span class="qtag">Checkpoint ${n} of ${QS.length}</span><span class="qkind">${kind}</span></div><p class="qprompt">${nl(q.prompt)}</p>`;
  if(q.type==='mcq'){
    h+='<div class="opts" role="radiogroup">';
    q.options.forEach((o,i)=>{
      const chosen=a?a.resp===i:d===i;let cls='opt';
      if(a){if(i===q.correct)cls+=' right';else if(chosen)cls+=' wrong'}else if(chosen)cls+=' chosen';
      h+=`<button type="button" class="${cls}" data-opt="${q.id}:${i}" ${a?'disabled':''} role="radio" aria-checked="${chosen}"><span class="ol">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`;
    });
    h+='</div>';
  }else if(q.type==='num'){
    h+=`<div class="numrow"><input type="text" inputmode="decimal" id="in-${q.id}" data-draft="${q.id}" placeholder="Your answer" value="${esc(a?a.respText:(d||''))}" ${a?'disabled':''}><span>${esc(q.unit||'')}</span></div>`;
  }else{
    const val=a?a.respText:(d||'');
    h+=`<textarea id="in-${q.id}" data-draft="${q.id}" data-min="${q.min}" placeholder="Write your response here…" ${a?'disabled':''}>${esc(val)}</textarea><div class="count" id="cnt-${q.id}">${val.trim().length} / ${q.min} characters minimum</div>`;
  }
  if(!a){
    h+=`<div class="qfoot"><button class="btn primary" data-act="submit" data-q="${q.id}">Submit &amp; record answer</button><span class="src">One attempt · your answer and its timestamp are recorded</span><span class="warn" id="warn-${q.id}"></span></div>`;
  }else{
    if(q.type==='text'){
      h+=`<div class="fb note"><strong>Recorded.</strong> This reflection is not auto-graded. What a strong answer includes:<ul>${q.guide.map(g=>`<li>${esc(g)}</li>`).join('')}</ul></div>`;
    }else{
      const ans=q.type==='mcq'?`<br><span class="src">Correct answer: <b>${esc(q.options[q.correct])}</b></span>`:(a.correct?'':`<br><span class="src">Correct answer: <b>${q.answer.toFixed(1)}${esc(q.unit||'')}</b></span>`);
      h+=`<div class="fb ${a.correct?'ok':'bad'}"><strong>${a.correct?'Correct.':'Not quite.'}</strong> ${ans}<br>${esc(q.explain)}</div>`;
    }
    h+=`<div class="stamp">Recorded ${fmtTS(a.at)} (${esc(TZ)}) · ${dur(a.at-(a.shown||a.at))} on this checkpoint</div>`;

function refreshCard(id){const el=$('#card-'+id);if(!el)return;const t=document.createElement('div');t.innerHTML=qHTML(QMAP[id]);el.replaceWith(t.firstElementChild)}
function submitQ(id){
  const q=QMAP[id];if(state.ans[id])return;
  const warn=m=>{const w=$('#warn-'+id);if(w)w.textContent=m};
  let rec={at:Date.now(),shown:state.shown[id]||Date.now()};
  if(q.type==='mcq'){
    const d=state.draft[id];if(typeof d!=='number'){warn('Pick an option first.');return}
    rec.resp=d;rec.respText=q.options[d];rec.correct=d===q.correct;
  }else if(q.type==='num'){
    const raw=($('#in-'+id).value||'').trim();
    let v=parseFloat(raw.replace(',','.').replace('%',''));
    if(isNaN(v)){warn('Enter a number.');return}
    if(q.pct&&v>0&&v<=1)v*=100;
    rec.resp=v;rec.respText=raw+(q.unit&&raw.indexOf(q.unit)<0?' '+q.unit:'');rec.correct=Math.abs(v-q.answer)<=q.tol;
  }else{
    const t=($('#in-'+id).value||'').trim();
    if(t.length<q.min){warn(`Please write at least ${q.min} characters (${t.length} so far).`);return}
    rec.resp=t;rec.respText=t;rec.correct=null;
  }
  state.ans[id]=rec;saveState();

/* ============================== PDF ============================== */
function pdfSafe(s){
  return String(s==null?'':s).replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—−]/g,'-').replace(/≥/g,'>=').replace(/≤/g,'<=')
   .replace(/→/g,'->').replace(/←/g,'<-').replace(/Σ/g,'Sum').replace(/÷/g,'/').replace(/±/g,'+/-').replace(/…/g,'...').replace(/[▲]/g,'^').replace(/[▼]/g,'v').replace(/↔/g,'<->')
   .replace(/[^\x09\x0A\x20-\x7E\xA0-\xFF]/g,'?');
}
function buildPDF(){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'pt',format:'a4'});
  const PW=doc.internal.pageSize.getWidth(),PH=doc.internal.pageSize.getHeight(),M=44,CW=PW-2*M;
  const BLUE=[30,75,209],INK=[23,33,47],MUT=[102,112,133],GRN=[21,128,61],RED=[180,40,28];
  let y=0;const S=pdfSafe;
  const ensure=h=>{if(y+h>PH-56){doc.addPage();y=M}};
  function para(str,o){o=o||{};const size=o.size||10,lh=size*1.38,ind=o.indent||0;
    doc.setFont('helvetica',o.bold?'bold':o.italic?'italic':'normal');doc.setFontSize(size);doc.setTextColor.apply(doc,o.color||INK);
    const lines=doc.splitTextToSize(S(str),CW-ind);
    for(const ln of lines){ensure(lh);doc.text(ln,M+ind,y+size);y+=lh}
    y+=(o.gap==null?4:o.gap)}
  const generated=Date.now();
  doc.setFillColor.apply(doc,BLUE);doc.rect(0,0,PW,92,'F');
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(21);doc.text('House of Quality - Learning Record',M,46);
  doc.setFont('helvetica','normal');doc.setFontSize(10.5);doc.text('Guided tour and checkpoint responses  |  MBA Operations Management',M,68);
  y=114;
  const kv=(l,v,x,yy)=>{doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor.apply(doc,MUT);doc.text(S(l).toUpperCase(),x,yy);doc.setFont('helvetica','normal');doc.setFontSize(10.5);doc.setTextColor.apply(doc,INK);doc.text(doc.splitTextToSize(S(v),CW/2-12),x,yy+13)};
  kv('Student',state.profile.name,M,y);kv('Course / section',state.profile.course||'-',M+CW/2,y);y+=40;
  kv('Tour started',fmtTS(state.started),M,y);kv('Tour finished',fmtTS(state.done||generated),M+CW/2,y);y+=40;
  kv('Time on tour',dur((state.done||generated)-state.started),M,y);kv('Time zone (device clock)',TZ,M+CW/2,y);y+=40;
  kv('Graded checkpoints correct',`${score()} of ${GRADED.length}`,M,y);kv('Record generated',fmtTS(generated),M+CW/2,y);y+=46;
  para('Response log',{size:13,bold:true,color:BLUE,gap:6});
  const cols=[24,196,104,58,CW-24-196-104-58];const heads=['Q','Station','Answered at','Time on Q','Result'];
  const rowH=17;ensure(rowH*2);
  doc.setFillColor(238,242,255);doc.rect(M,y,CW,rowH,'F');doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor.apply(doc,MUT);
  let cx=M;heads.forEach((h,i)=>{doc.text(h.toUpperCase(),cx+4,y+12);cx+=cols[i]});y+=rowH;
  const stationOf=id=>{for(let i=0;i<STATIONS.length;i++)if(STATIONS[i].qs.includes(id))return i};
  QS.forEach(q=>{const a=state.ans[q.id];ensure(rowH);
    doc.setDrawColor(216,208,189);doc.line(M,y+rowH,M+CW,y+rowH);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor.apply(doc,INK);
    cx=M;const st=S(`${stationOf(q.id)+1}. ${STATIONS[stationOf(q.id)].title}`);let stT=st;while(stT.length>4&&doc.getTextWidth(stT)>cols[1]-10)stT=stT.slice(0,-1);if(stT!==st)stT=stT.trim()+'...';
    const cells=[String(QNUM[q.id]),stT,fmtTS(a.at),dur(a.at-(a.shown||a.at)),resultLabel(a)];
    cells.forEach((c,i)=>{if(i===4)doc.setTextColor.apply(doc,a.correct===null?BLUE:a.correct?GRN:RED);else doc.setTextColor.apply(doc,INK);doc.text(S(c),cx+4,y+12);cx+=cols[i]});y+=rowH});
  y+=16;
  para('Detailed responses',{size:13,bold:true,color:BLUE,gap:8});
  QS.forEach(q=>{const a=state.ans[q.id];ensure(80);
    doc.setFillColor(244,240,230);doc.rect(M,y,CW,20,'F');doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.setTextColor.apply(doc,BLUE);
    doc.text(S(`Checkpoint ${QNUM[q.id]}  |  Station ${stationOf(q.id)+1}: ${STATIONS[stationOf(q.id)].title}`),M+6,y+13.5);
    doc.setFont('helvetica','normal');doc.setTextColor.apply(doc,MUT);doc.setFontSize(8.5);const ts=S(`Answered ${fmtTS(a.at)}`);doc.text(ts,M+CW-6-doc.getTextWidth(ts),y+13.5);y+=26;
    para(q.prompt,{size:10,bold:true,gap:5});
    para('Your response: '+a.respText,{size:10,gap:5});
    if(a.correct===null){
      para('Reflection - not auto-graded.',{size:9.5,bold:true,color:BLUE,gap:2});
      para('What a strong answer includes: '+q.guide.join(' | '),{size:9,color:MUT,italic:true,gap:12});
    }else{
      para((a.correct?'Result: Correct':'Result: Incorrect')+(a.correct?'':'  -  correct answer: '+(q.type==='mcq'?q.options[q.correct]:q.answer.toFixed(1)+' '+(q.unit||''))),{size:9.5,bold:true,color:a.correct?GRN:RED,gap:2});
      para(q.explain,{size:9,color:MUT,italic:true,gap:12});
    }
  });
  const n=doc.internal.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor.apply(doc,MUT);
    doc.text(S(`${state.profile.name}  |  House of Quality learning record  |  generated ${fmtTS(generated)} (${TZ})`),M,PH-26);
    const pg=`Page ${i} of ${n}`;doc.text(pg,PW-M-doc.getTextWidth(pg),PH-26)}
  return doc.output('blob');
}
async function getDownloads(){try{if(window.claude&&typeof window.claude.use==='function')return await window.claude.use('downloads')}catch(e){}return null}
async function saveFile(filename,data){
  const dl=await getDownloads();
  if(dl){await dl.save({filename,data});return 'saved'}
  const blob=data instanceof Blob?data:new Blob([data],{type:'application/octet-stream'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);return 'anchor';
}
const fileSlug=()=>((state.profile.name||'student').trim().replace(/[^A-Za-z0-9]+/g,'_').slice(0,30)||'student');
function stationIdx(id){for(let i=0;i<STATIONS.length;i++)if(STATIONS[i].qs.includes(id))return i}
function exportPayload(){
  return {schema:'hoq-tour-submission/v1',student:{name:state.profile.name,course:state.profile.course||''},
    startedAt:new Date(state.started).toISOString(),finishedAt:new Date(state.done||Date.now()).toISOString(),timeZone:TZ,
    score:{correct:score(),graded:GRADED.length},
    answers:QS.map(q=>{const a=state.ans[q.id];return{id:q.id,n:QNUM[q.id],station:stationIdx(q.id)+1,type:q.type,prompt:q.prompt,
      response:a.respText,responseIndex:q.type==='mcq'?a.resp:null,correct:a.correct,
      answeredAt:new Date(a.at).toISOString(),shownAt:new Date(a.shown||a.at).toISOString(),secondsOnQuestion:Math.round((a.at-(a.shown||a.at))/1000)}})};
}
async function savePDF(){
  const msg=$('#saveMsg');const say=t=>{if(msg)msg.textContent=t};
  if(!window.jspdf){say('The PDF library could not be loaded (network). Use “Print / save via browser” instead.');return}
  let blob;try{blob=buildPDF()}catch(e){console.error(e);say('Sorry — building the PDF failed. Use “Print / save via browser” instead.');return}
  const filename=`HoQ_Record_${fileSlug()}_${stampFile(Date.now())}.pdf`;
  try{const r=await saveFile(filename,blob);say(r==='saved'?`Saved ${filename}.`:`Download started: ${filename}. If nothing happened, use “Print / save via browser”.`)}
  catch(e){say(e&&e.code==='declined'?'Save cancelled — press the button again whenever you are ready.':'Could not save the file here. Use “Print / save via browser” instead.')}
}
async function saveJSON(){
  const msg=$('#saveMsg');const say=t=>{if(msg)msg.textContent=t};
  const filename=`HoQ_Submission_${fileSlug()}_${stampFile(Date.now())}.json`;
  try{const r=await saveFile(filename,JSON.stringify(exportPayload(),null,2));say(r==='saved'?`Saved ${filename}. Send this file to your instructor.`:`Download started: ${filename}. Send this file to your instructor.`)}
  catch(e){say(e&&e.code==='declined'?'Save cancelled.':'Could not save the file here.')}
}

/* ============================== EVENTS ============================== */
document.addEventListener('click',e=>{
  const t=e.target;
  const act=t.closest('[data-act]');
  if(act){
    const a=act.dataset.act;
    if(a==='begin'){
      const name=($('#f-name').value||'').trim();if(!name){$('#f-warn').textContent='Please enter your name.';return}
      state=newState();state.profile={name,course:($('#f-course').value||'').trim()};state.started=Date.now();go(0);return}
    if(a==='resume'){go(Math.min(state.last||0,STATIONS.length))}
    if(a==='restart'){
      if(!eraseArmed){eraseArmed=true;act.textContent='Click again to erase everything';return}
      state=newState();saveState();eraseArmed=false;render();return}
    if(a==='next'){if(state.step===STATIONS.length-1&&!allDone())return;if(!stationDone(state.step))return;go(state.step+1)}
    if(a==='prev'){go(state.step-1)}
    if(a==='submit'){submitQ(act.dataset.q)}
    if(a==='reset-model'){state.model=freshModel();saveState();refreshHouse();const tm=$('#toolMount');tm.innerHTML=toolHTML(state.step);updateTool()}
    if(a==='norm'){state.model.norm=!state.model.norm;refreshHouse();updateTool()}
    if(a==='savepdf')savePDF();
    if(a==='savejson')saveJSON();
    if(a==='print'){try{window.print()}catch(err){}const msg=$('#saveMsg');if(msg)msg.textContent='If no print dialog appeared, use your browser menu: Print → Save as PDF.'}
    return;
  }
  const go2=t.closest('[data-goto]');if(go2&&!go2.disabled){go(+go2.dataset.goto);return}
  const opt=t.closest('[data-opt]');
  if(opt&&!opt.disabled){const [id,i]=opt.dataset.opt.split(':');state.draft[id]=+i;saveState();refreshCard(id);return}
  const cas=t.closest('[data-cas]');if(cas){state.cas=+cas.dataset.cas;updateTool();return}
  const cell=t.closest('[data-cell]');
  if(cell){const [i,j]=cell.dataset.cell.split('-').map(Number);const nx={0:1,1:3,3:9,9:0};state.model.R[i][j]=nx[state.model.R[i][j]];saveState();refreshHouse();readCell(i,j);updateTool();return}
  const rc=t.closest('[data-roofcell]');
  if(rc){const key=rc.dataset.roofcell;const nx={'0':3,'3':9,'9':-3,'-3':-9,'-9':0};const cur=state.model.roof[key]||0;state.model.roof[key]=nx[String(cur)];saveState();refreshHouse();readRoof(key);return}
  const dc=t.closest('[data-dircell]');
  if(dc){const j=+dc.dataset.dircell;state.model.dir[j]=state.model.dir[j]==='up'?'down':'up';saveState();refreshHouse();const r=$('#readout');if(r)r.innerHTML=`<b>${esc(HOWS[j].name)}</b> (${HOWS[j].unit}): now <b>${state.model.dir[j]==='up'?'maximise ▲':'minimise ▼'}</b>.${state.model.dir[j]===HOWS[j].dir?'':' <span class="warn">That is the opposite of what a customer would want here.</span>'}`;return}
  if(state.step===1){
    const room=t.closest('[data-room]');
    if(room){state.room=room.dataset.room;state.visited[state.room]=1;saveState();refreshHouse();updateTool();}
  }
});
function readCell(i,j){const r=$('#readout');if(!r)return;const v=state.model.R[i][j];const w={0:'has no meaningful relationship with',1:'weakly affects',3:'moderately affects',9:'strongly affects'}[v];r.innerHTML=`Changing <b>${esc(HOWS[j].name)}</b> ${w} <b>${esc(NEEDS[i].name)}</b> (score ${v}). Contribution to TP: ${state.model.w[i]} × ${v} = <b>${state.model.w[i]*v}</b>.`}
function readRoof(key){const r=$('#readout');if(!r)return;const [i,j]=key.split('-').map(Number);const v=state.model.roof[key]||0;r.innerHTML=`<b>${esc(HOWS[i].name)}</b> × <b>${esc(HOWS[j].name)}</b>: ${ROOFLAB[String(v)]}.`}
document.addEventListener('mouseover',e=>{
  const c=e.target.closest('[data-cell]');if(c&&STATIONS[state.step]&&STATIONS[state.step].tool==='matrix'){const [i,j]=c.dataset.cell.split('-').map(Number);readCell(i,j);return}
  const r=e.target.closest('[data-roofcell]');if(r)readRoof(r.dataset.roofcell);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.w!=null){state.model.w[+t.dataset.w]=+t.value;saveState();refreshHouse();updateTool();return}
  if(t.dataset.us!=null){state.model.us[+t.dataset.us]=+t.value;saveState();refreshHouse();updateTool();return}
  if(t.dataset.draft){const id=t.dataset.draft;state.draft[id]=t.value;saveState();
    if(t.dataset.min){const c=$('#cnt-'+id);if(c)c.textContent=`${t.value.trim().length} / ${t.dataset.min} characters minimum`}}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-cell],[data-roofcell],[data-dircell]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
});

/* ============================== START ============================== */
if(state.profile&&state.started&&state.step>=0){/* resume prompt */state.step=-1}
render();
</script>
